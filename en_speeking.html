<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listening-Speaking Lesson</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    h1.app-title {
      color: #2c3e50;
      font-size: 2rem;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 460px;
      text-align: center;
      box-sizing: border-box;
    }
    .word-counter {
      font-size: 0.95rem;
      color: #7f8c8d;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .word-display {
      font-size: 2.5rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 4px;
      word-break: break-word;
    }
    .word-meaning {
      font-size: 1.1rem;
      color: #7f8c8d;
      margin-bottom: 20px;
      font-weight: 500;
    }
    .pos-tag {
      font-size: 0.85rem;
      background-color: #e2e8f0;
      color: #4a5568;
      padding: 2px 6px;
      border-radius: 4px;
      margin-right: 6px;
      font-weight: bold;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .audio-block {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #e9ecef;
    }
    /* すべての波形コンテナの下余白（margin-bottom）を揃える */
    .canvas-container {
      height: 50px;
      margin-top: 6px;
      margin-bottom: 0;
      background: #2c3e50;
      border-radius: 4px;
      overflow: hidden;
    }
    /* 録音ブロック内の波形と下ボタンの間のみ間隔を空ける */
    .canvas-container.has-bottom-btn {
      margin-bottom: 8px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    button {
      width: 100%;
      padding: 12px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: bold;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-native { background-color: #3498db; color: white; }
    .btn-native:hover:not(:disabled) { background-color: #2980b9; }
    
    .btn-rec { background-color: #2ecc71; color: white; }
    .btn-rec:hover:not(:disabled) { background-color: #27ae60; }
    .btn-rec.recording {
      animation: pulse 1.5s infinite;
      background-color: #e74c3c;
    }

    .btn-user { background-color: #1abc9c; color: white; }
    .btn-user:hover:not(:disabled) { background-color: #16a085; }

    .btn-both { background-color: #f39c12; color: white; }
    .btn-both:hover:not(:disabled) { background-color: #d68910; }

    .btn-next { background-color: #9b59b6; color: white; margin-top: 10px; }
    .btn-next:hover { background-color: #8e44ad; }

    .finish-screen {
      display: none;
    }
    .finish-screen h2 {
      color: #2c3e50;
      margin-bottom: 10px;
    }
    .finish-screen p {
      color: #7f8c8d;
      margin-bottom: 25px;
    }
    .btn-restart {
      background-color: #34495e;
      color: white;
    }
    .btn-restart:hover {
      background-color: #2c3e50;
    }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
  </style>
</head>

<h1 class="app-title">Listening-Speaking Lesson</h1>

<div class="card">
  <!-- メイン練習エリア -->
  <div id="quizArea">
    <div class="word-counter" id="wordCounter">1 / 10</div>
    <div class="word-display" id="wordDisplay">apple</div>

    <div class="controls">
      <!-- ネイティブ発音ブロック -->
      <div class="audio-block">
        <button class="btn-native" id="playNativeBtn">🔊 ネイティブの発音を聴く</button>
        <div class="canvas-container">
          <canvas id="nativeCanvas"></canvas>
        </div>
      </div>

      <!-- 録音・自分の発音ブロック -->
      <div class="audio-block">
        <button class="btn-rec" id="recordBtn">🎙️ 録音を開始する</button>
        <div class="canvas-container has-bottom-btn">
          <canvas id="userCanvas"></canvas>
        </div>
        <button class="btn-user" id="playUserBtn" disabled>🔊 自分の発音を聴く</button>
      </div>

      <!-- 同時再生ブロック -->
      <div class="audio-block">
        <button class="btn-both" id="playBothBtn" disabled>🎧 両方の発音を同時に聴く</button>
        <div class="canvas-container">
          <canvas id="bothCanvas"></canvas>
        </div>
      </div>

      <button class="btn-next" id="nextWordBtn">次へ ➔</button>
    </div>
  </div>

</div>

    { en: "when", pos: "副", ja: "いつ" }, { en: "where", pos: "副", ja: "どこ" },
    { en: "which", pos: "代", ja: "どちら" }, { en: "white", pos: "形", ja: "白い" },
    { en: "who", pos: "代", ja: "誰" }, { en: "why", pos: "副", ja: "なぜ" },
    { en: "wife", pos: "名", ja: "妻" }, { en: "will", pos: "助", ja: "〜だろう" },
    { en: "win", pos: "動", ja: "勝つ" }, { en: "wind", pos: "名", ja: "風" },
    { en: "window", pos: "名", ja: "窓" }, { en: "winter", pos: "名", ja: "冬" },
    { en: "with", pos: "前", ja: "〜と一緒に" }, { en: "without", pos: "前", ja: "〜なしで" },
    { en: "woman", pos: "名", ja: "女性" }, { en: "wonderful", pos: "形", ja: "素晴らしい" },
    { en: "word", pos: "名", ja: "単語" }, { en: "work", pos: "動", ja: "働く" },
    { en: "world", pos: "名", ja: "世界" }, { en: "worry", pos: "動", ja: "心配する" },
    { en: "write", pos: "動", ja: "書く" }, { en: "wrong", pos: "形", ja: "間違った" },
    { en: "year", pos: "名", ja: "年" }, { en: "yellow", pos: "形", ja: "黄色い" },
    { en: "yes", pos: "副", ja: "はい" }, { en: "yesterday", pos: "名", ja: "昨日" },
    { en: "you", pos: "代", ja: "あなた" }, { en: "young", pos: "形", ja: "若い" },
    { en: "your", pos: "代", ja: "あなたの" }, { en: "zoo", pos: "名", ja: "動物園" }
  ];

  let currentWords = [];
  let currentWordIndex = 0;

  let audioCtx = null;
  let mediaRecorder = null;
  let audioChunks = [];
  
  let nativeAudioBuffer = null;
  let userAudioBuffer = null;

  const quizArea = document.getElementById('quizArea');
  const finishArea = document.getElementById('finishArea');
  const wordDisplay = document.getElementById('wordDisplay');
  const wordMeaning = document.getElementById('wordMeaning');
  const wordCounter = document.getElementById('wordCounter');

  const playNativeBtn = document.getElementById('playNativeBtn');
  const recordBtn = document.getElementById('recordBtn');
  const playUserBtn = document.getElementById('playUserBtn');
  const playBothBtn = document.getElementById('playBothBtn');
  const nextWordBtn = document.getElementById('nextWordBtn');
  const restartBtn = document.getElementById('restartBtn');

  const nativeCanvas = document.getElementById('nativeCanvas');
  const userCanvas = document.getElementById('userCanvas');
  const bothCanvas = document.getElementById('bothCanvas');

  function getAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  // 音節数の算出関数
  function countSyllables(word) {
    word = word.toLowerCase().trim();
    if (word.length <= 3) return 1;
    word = word.replace(/(?:[^laeiouy]es|ed|[^laeiouy]e)$/, '');
    word = word.replace(/^y/, '');
    const matches = word.match(/[aeiouy]{1,2}/g);
    return matches ? Math.max(1, matches.length) : 1;
  }

  // 500語からランダムに10個抽出
  function initSession() {
    const shuffled = [...masterWords].sort(() => 0.5 - Math.random());
    currentWords = shuffled.slice(0, 10);
    currentWordIndex = 0;
    
    quizArea.style.display = 'block';
    finishArea.style.display = 'none';

    updateWord();
  }

  // 表示更新
  function updateWord() {
    if (currentWordIndex >= currentWords.length) {
      quizArea.style.display = 'none';
      finishArea.style.display = 'block';
      return;
    }

    const item = currentWords[currentWordIndex];
    wordCounter.textContent = `${currentWordIndex + 1} / 10`;
    wordDisplay.textContent = item.en;
    wordMeaning.innerHTML = `<span class="pos-tag">${item.pos}</span>${item.ja}`;

    playUserBtn.disabled = true;
    playBothBtn.disabled = true;
    userAudioBuffer = null;

    if (currentWordIndex === currentWords.length - 1) {
      nextWordBtn.textContent = '結果を見る ➔';
    } else {
      nextWordBtn.textContent = '次へ ➔';
    }
    
    clearCanvas(nativeCanvas);
    clearCanvas(userCanvas);
    clearCanvas(bothCanvas);

    renderNativeWaveform(item.en);
  }

  // ネイティブ音声波形描画処理
  function renderNativeWaveform(text) {
    const ctx = getAudioContext();
    const sampleRate = ctx.sampleRate;
    
    const syllableCount = countSyllables(text);
    const duration = Math.max(0.4, syllableCount * 0.28 + (text.length > 6 ? 0.15 : 0));
    const buffer = ctx.createBuffer(1, Math.floor(sampleRate * duration), sampleRate);
    const data = buffer.getChannelData(0);

    for (let i = 0; i < data.length; i++) {
      const t = i / sampleRate;
      const progress = t / duration;

      const globalEnvelope = Math.sin(progress * Math.PI);
      const syllableProgress = (progress * syllableCount) % 1;
      const currentSyllableIndex = Math.floor(progress * syllableCount);
      
      const accent = (currentSyllableIndex === 0) ? 1.0 : 0.75;
      const syllableEnvelope = Math.sin(syllableProgress * Math.PI) * accent;

      const f0 = 150;
      const fundamental = Math.sin(2 * Math.PI * f0 * t);
      const h1 = 0.5 * Math.sin(2 * Math.PI * (f0 * 2) * t);
      const h2 = 0.3 * Math.sin(2 * Math.PI * (f0 * 3.2) * t);
      const noise = (Math.random() - 0.5) * 0.08;

      data[i] = (fundamental + h1 + h2 + noise) * globalEnvelope * syllableEnvelope * 0.6;
    }

    nativeAudioBuffer = trimAudioBuffer(buffer);
    drawWaveform(nativeCanvas, nativeAudioBuffer, '#3498db');
  }

  // 無音削除処理
  function trimAudioBuffer(buffer, threshold = 0.015) {
    const ctx = getAudioContext();
    const data = buffer.getChannelData(0);
    let start = 0;
    let end = data.length - 1;

    while (start < data.length && Math.abs(data[start]) < threshold) start++;
    while (end > start && Math.abs(data[end]) < threshold) end--;

    const padding = Math.floor(buffer.sampleRate * 0.02);
    start = Math.max(0, start - padding);
    end = Math.min(data.length - 1, end + padding);

    const trimmedLength = Math.max(1, end - start + 1);
    const trimmedBuffer = ctx.createBuffer(buffer.numberOfChannels, trimmedLength, buffer.sampleRate);

    for (let i = 0; i < buffer.numberOfChannels; i++) {
      trimmedBuffer.getChannelData(i).set(buffer.getChannelData(i).subarray(start, end + 1));
    }
    return trimmedBuffer;
  }

  // 単一波形の描画
  function drawWaveform(canvas, audioBuffer, color = '#2ecc71') {
    const ctx = canvas.getContext('2d');
    const width = canvas.width = canvas.parentElement.clientWidth || 400;
    const height = canvas.height = canvas.parentElement.clientHeight || 50;
    
    ctx.clearRect(0, 0, width, height);
    if (!audioBuffer) return;

    const data = audioBuffer.getChannelData(0);
    const step = Math.ceil(data.length / width);
    const amp = height / 2;

    ctx.fillStyle = color;

    for (let i = 0; i < width; i++) {
      let min = 1.0;
      let max = -1.0;
      for (let j = 0; j < step; j++) {
        const datum = data[(i * step) + j];
        if (datum !== undefined) {
          if (datum < min) min = datum;
          if (datum > max) max = datum;
        }
      }
      if (min <= max) {
        const barHeight = Math.max(2, (max - min) * amp);
        const y = (1 + min) * amp;
        ctx.fillRect(i, y, 1.5, barHeight);
      }
    }
  }

  // 重ね合わせ波形の描画
  function drawBothWaveform() {
    const ctx = bothCanvas.getContext('2d');
    const width = bothCanvas.width = bothCanvas.parentElement.clientWidth || 400;
    const height = bothCanvas.height = bothCanvas.parentElement.clientHeight || 50;

    ctx.clearRect(0, 0, width, height);

    if (nativeAudioBuffer) {
      drawWaveformToContext(ctx, width, height, nativeAudioBuffer, 'rgba(52, 152, 219, 0.75)');
    }

    if (userAudioBuffer) {
      drawWaveformToContext(ctx, width, height, userAudioBuffer, 'rgba(46, 204, 113, 0.75)');
    }
  }

  function drawWaveformToContext(ctx, width, height, audioBuffer, color) {
    const data = audioBuffer.getChannelData(0);
    const step = Math.ceil(data.length / width);
    const amp = height / 2;

    ctx.fillStyle = color;
    for (let i = 0; i < width; i++) {
      let min = 1.0, max = -1.0;
      for (let j = 0; j < step; j++) {
        const datum = data[(i * step) + j];
        if (datum !== undefined) {
          if (datum < min) min = datum;
          if (datum > max) max = datum;
        }
      }
      if (min <= max) {
        const barHeight = Math.max(2, (max - min) * amp);
        const y = (1 + min) * amp;
        ctx.fillRect(i, y, 1.5, barHeight);
      }
    }
  }

  function clearCanvas(canvas) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // 1. ネイティブ再生
  playNativeBtn.addEventListener('click', () => {
    getAudioContext();
    window.speechSynthesis.cancel();
    const utterance = new SpeechSynthesisUtterance(currentWords[currentWordIndex].en);
    utterance.lang = 'en-US';
    window.speechSynthesis.speak(utterance);
  });

  // 2. 録音処理
  recordBtn.addEventListener('click', async () => {
    const ctx = getAudioContext();

    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      recordBtn.textContent = '処理中...';
      recordBtn.disabled = true;
      recordBtn.classList.remove('recording');
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);

      mediaRecorder.onstop = async () => {
        const rawBlob = new Blob(audioChunks);
        const arrayBuffer = await rawBlob.arrayBuffer();
        const decodedBuffer = await ctx.decodeAudioData(arrayBuffer);

        userAudioBuffer = trimAudioBuffer(decodedBuffer);

        drawWaveform(userCanvas, userAudioBuffer, '#2ecc71');
        drawBothWaveform();

        playUserBtn.disabled = false;
        playBothBtn.disabled = false;
        recordBtn.textContent = '🎙️ 録音を開始する';
        recordBtn.disabled = false;

        stream.getTracks().forEach(track => track.stop());
      };

      mediaRecorder.start();
      recordBtn.textContent = '⏹️ 録音を停止する';
      recordBtn.classList.add('recording');
    } catch (err) {
      alert('マイクへのアクセスを許可してください。');
      recordBtn.disabled = false;
    }
  });

  // 3. 自分の発音再生
  playUserBtn.addEventListener('click', () => {
    if (!userAudioBuffer) return;
    const ctx = getAudioContext();
    const source = ctx.createBufferSource();
    source.buffer = userAudioBuffer;
    source.connect(ctx.destination);
    source.start(0);
  });

  // 4. 出だしを同期させて同時再生
  playBothBtn.addEventListener('click', () => {
    if (!userAudioBuffer) return;
    const ctx = getAudioContext();

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(currentWords[currentWordIndex].en);
    utterance.lang = 'en-US';

    utterance.onstart = () => {
      const source = ctx.createBufferSource();
      source.buffer = userAudioBuffer;
      source.connect(ctx.destination);
      source.start(0);
    };

    window.speechSynthesis.speak(utterance);
  });

  // 5. 次の単語へ
  nextWordBtn.addEventListener('click', () => {
    currentWordIndex++;
    updateWord();
  });

  // 6. リスタート
  restartBtn.addEventListener('click', () => {
    initSession();
  });

  // 初期化
  initSession();
</script>
