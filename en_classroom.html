<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Classroom English</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; text-align: center; background-color: #e0e7ff; margin: 0; padding: 20px; }
        h1 { color: #1e293b; margin-bottom: 5px; }
        .description { color: #64748b; margin-bottom: 20px; }
        
        .container { 
            position: relative; 
            display: inline-block; 
            background: white; 
            padding: 10px; 
            border-radius: 15px; 
            box-shadow: 0 10px 25px rgba(0,0,0,0.1);
        }

        /* SVG内の要素に対するスタイル */
        svg { border-radius: 8px; display: block; }
        .clickable { cursor: pointer; transition: opacity 0.2s; }
        .clickable:hover { opacity: 0.8; filter: brightness(1.1); }
        
        .label-display { 
            margin-top: 25px; 
            font-size: 28px; 
            font-weight: bold; 
            color: #1e40af; 
            background: #dbeafe;
            padding: 15px;
            border-radius: 50px;
            display: inline-block;
            min-width: 300px;
            transition: all 0.3s;
        }

        .hint { font-size: 14px; color: #94a3b8; margin-top: 15px; }
    </style>
</head>
<body>

    <h1>🏫 Interactive Classroom</h1>
    <p class="description">イラストのなかをタップして、名前を覚えよう！</p>

    <div class="container">
        <svg width="700" height="450" viewBox="0 0 700 450" xmlns="http://www.w3.org/2000/svg">
            <rect width="700" height="350" fill="#f8fafc" />
            <rect y="350" width="700" height="100" fill="#94a3b8" />
            
            <g class="clickable" onclick="speak('Window', 'まど')">
                <rect x="30" y="40" width="100" height="140" fill="#bae6fd" stroke="#334155" stroke-width="4"/>
                <line x1="80" y1="40" x2="80" y2="180" stroke="#334155" stroke-width="2"/>
                <line x1="30" y1="110" x2="130" y2="110" stroke="#334155" stroke-width="2"/>
            </g>

            <g class="clickable" onclick="speak('Blackboard', 'こくばん')">
                <rect x="180" y="50" width="340" height="160" fill="#064e3b" rx="5" />
                <rect x="175" y="45" width="350" height="170" fill="none" stroke="#78350f" stroke-width="8" rx="5" />
                <rect x="175" y="210" width="350" height="10" fill="#94a3b8" />
            </g>

            <g class="clickable" onclick="speak('Clock', 'とけい')">
                <circle cx="600" cy="80" r="35" fill="white" stroke="#1e293b" stroke-width="3" />
                <line x1="600" y1="80" x2="600" y2="60" stroke="#1e293b" stroke-width="3" stroke-linecap="round" />
                <line x1="600" y1="80" x2="620" y2="80" stroke="#1e293b" stroke-width="2" stroke-linecap="round" />
                <circle cx="600" cy="80" r="3" fill="#ef4444" />
            </g>

            <g class="clickable" onclick="speak('Bookshelf', 'ほんだな')">
                <rect x="580" y="150" width="80" height="180" fill="#92400e" />
                <rect x="585" y="160" width="15" height="40" fill="#ef4444" />
                <rect x="605" y="160" width="15" height="40" fill="#3b82f6" />
                <rect x="625" y="160" width="15" height="40" fill="#10b981" />
                <line x1="580" y1="210" x2="660" y2="210" stroke="#451a03" stroke-width="2" />
            </g>

            <g class="clickable" onclick="speak('Desk', 'つくえ')">
                <rect x="250" y="240" width="200" height="80" fill="#b45309" rx="2" />
                <rect x="260" y="250" width="50" height="20" fill="#78350f" />
                <rect x="390" y="250" width="50" height="20" fill="#78350f" />
            </g>

            <g class="clickable" onclick="speak('Laptop', 'ノートパソコン')">
                <rect x="310" y="225" width="60" height="5" fill="#475569" />
                <rect x="315" y="200" width="50" height="30" fill="#94a3b8" stroke="#475569" stroke-width="1" />
            </g>

            <g class="clickable" onclick="speak('Chair', 'いす')">
                <rect x="130" y="380" width="80" height="15" fill="#ea580c" />
                <rect x="130" y="340" width="80" height="40" fill="#ea580c" />
            </g>
            <g class="clickable" onclick="speak('Desk', 'つくえ')">
                <rect x="110" y="360" width="120" height="50" fill="#d97706" />
            </g>
            <rect class="clickable" x="125" y="365" width="40" height="12" rx="5" fill="#facc15" onclick="event.stopPropagation(); speak('Pencil case', 'ふでばこ')" />

            <g class="clickable" onclick="speak('Chair', 'いす')">
                <rect x="490" y="380" width="80" height="15" fill="#ea580c" />
                <rect x="490" y="340" width="80" height="40" fill="#ea580c" />
            </g>
            <g class="clickable" onclick="speak('Desk', 'つくえ')">
                <rect x="470" y="360" width="120" height="50" fill="#d97706" />
            </g>
            <rect class="clickable" x="530" y="365" width="35" height="25" fill="#f8fafc" stroke="#64748b" onclick="event.stopPropagation(); speak('Textbook', 'きょうかしょ')" />

            <g class="clickable" onclick="speak('Trash can', 'ごみばこ')">
                <path d="M 620 420 L 660 420 L 665 380 L 615 380 Z" fill="#64748b" />
                <line x1="615" y1="385" x2="665" y2="385" stroke="#475569" stroke-width="2" />
            </g>

            <g class="clickable" onclick="speak('Plant', 'しょくぶつ')">
                <rect x="20" y="280" width="40" height="40" fill="#b45309" />
                <path d="M 25 280 Q 5 240 30 220 Q 55 240 35 280" fill="#22c55e" />
                <path d="M 45 280 Q 70 240 50 220 Q 30 240 45 280" fill="#16a34a" />
            </g>
        </svg>
    </div>

    <div>
        <div id="label" class="label-display">Tap an item!</div>
    </div>
    
    <div class="hint">🔈 音声をONにして学習してね</div>

    <script>
        function speak(word, japanese) {
            const label = document.getElementById('label');
            label.innerText = `${word} - ${japanese}`;
            
            // アニメーション効果
            label.style.transform = "scale(1.1)";
            setTimeout(() => label.style.transform = "scale(1)", 150);

            if (!('speechSynthesis' in window)) {
                alert("このブラウザは音声読み上げに対応していません。");
                return;
            }

            window.speechSynthesis.cancel();
            const uttr = new SpeechSynthesisUtterance();
            uttr.text = word;
            uttr.lang = 'en-US';
            uttr.rate = 0.85;
            uttr.pitch = 1.0;
            window.speechSynthesis.speak(uttr);
        }
    </script>
</body>
</html>
