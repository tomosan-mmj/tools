<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>ｎ次関数グラフ　ｙ＝ｆ（ｘ）</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/hammerjs@2.0.8"></script>
    <script src="https://cdn.jsdelivr.net/npm/chartjs-plugin-zoom@2.0.1"></script>
    <style>
        body, html { margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden; touch-action: none; }
        input { font-variant-numeric: tabular-nums; }
        .glass-panel { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-thumb { background: #ccc; border-radius: 3px; }
    </style>
</head>
<body class="bg-gray-50 relative font-sans text-gray-800">
    <!-- グラフ描画領域 -->
    <div class="absolute inset-0 w-full h-full">
        <canvas id="myChart"></canvas>
    </div>

    <!-- 右上のフローティング操作パネル -->
    <div id="controlPanel" class="absolute top-4 right-4 glass-panel p-4 rounded-xl shadow-lg border border-gray-200 w-80 max-h-[calc(100vh-140px)] overflow-y-auto flex flex-col gap-4 z-10 transition-transform origin-top-right">
        <div class="flex justify-between items-center border-b border-gray-200 pb-2">
            <h2 class="font-bold text-lg text-gray-700">グラフ設定</h2>
            <button id="togglePanelBtn" class="text-gray-400 hover:text-gray-700 p-1 text-xl leading-none">_</button>
        </div>
        <div id="controlsContainer" class="flex flex-col gap-5 transition-all">
            <!-- JavaScriptでコントロールUIを生成 -->
        </div>
    </div>

    <!-- 下部のxy対応表 -->
    <div class="absolute bottom-4 left-1/2 transform -translate-x-1/2 glass-panel p-2 rounded-xl shadow-2xl border border-gray-200 z-10 max-w-[95vw] overflow-x-auto text-sm pointer-events-auto">
        <table id="dataTable" class="min-w-max border-collapse select-none">
            <!-- JavaScriptで表を生成 -->
        </table>
    </div>

    <script>
        // --- 状態管理 ---
        let chart = null;
        let activeCrosshair = null; 
        let lastHoveredX = 0;

        const config = {
            xMin: -10,
            xMax: 10,
            yMin: -10,
            yMax: 10,
            funcs: [
                { id: 1, color: '#2563eb', coeffs: ['1', '0', '0'] },
                { id: 2, color: '#dc2626', coeffs: ['-1', '2', '0'] }
            ]
        };

        // --- ユーティリティ ---
        function parseVal(v) {
            try {
                const parsed = eval(v.toString().replace(/[^0-9\.\-\+\/\*]/g, ''));
                return isNaN(parsed) ? 0 : parsed;
            } catch {
                return 0;
            }
        }

        function formatPolynomial(coeffs) {
            const degree = coeffs.length - 1;
            let str = '';
            for (let i = 0; i <= degree; i++) {
                const rawVal = coeffs[i].toString().trim();
                const val = parseVal(rawVal);
                if (val === 0) continue; 

                const power = degree - i;
                let term = '';

                if (val > 0 && str !== '') term += ' + ';
                if (val < 0 && str !== '') term += ' - ';
                if (val < 0 && str === '') term += '-';

                let absRaw = rawVal.replace(/^[+-]/, '').trim();
                
                if ((val === 1 || val === -1) && power > 0) {
                    // 1, -1 は省略
                } else {
                    term += absRaw;
                }

                if (power > 0) {
                    term += 'x';
                    if (power > 1) {
                        const superscripts = ['⁰','¹','²','³','⁴','⁵','⁶','⁷','⁸','⁹'];
                        term += power.toString().split('').map(d => superscripts[parseInt(d)]).join('');
                    }
                }
                str += term;
            }
            return str || '0';
        }

        function evaluatePoly(coeffs, x) {
            let y = 0;
            let degree = coeffs.length - 1;
            for (let i = 0; i <= degree; i++) {
                y += parseVal(coeffs[i]) * Math.pow(x, degree - i);
            }
            return y;
        }

        // --- カスタムUIコンポーネント ---
        function createUniversalInput({ id, value, label, onChange, color = 'text-gray-800' }) {
            const wrapper = document.createElement('div');
            wrapper.className = 'flex items-center justify-between text-sm mb-1.5';

            if (label) {
                const lbl = document.createElement('span');
                lbl.className = `mr-2 font-mono font-bold whitespace-nowrap ${color}`;
                lbl.innerHTML = label;
                wrapper.appendChild(lbl);
            }

            const container = document.createElement('div');
            container.className = 'flex items-center border border-gray-300 rounded overflow-hidden shadow-sm bg-white touch-none flex-shrink-0';

            const btnDec = document.createElement('button');
            btnDec.className = 'px-3 py-1 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 font-bold select-none cursor-pointer border-r border-gray-200';
            btnDec.innerText = '−';

            const input = document.createElement('input');
            if (id) input.id = id;
            input.type = 'text';
            input.value = value;
            input.className = 'w-14 text-center outline-none bg-transparent py-1 font-mono text-sm';

            const btnInc = document.createElement('button');
            btnInc.className = 'px-3 py-1 bg-gray-100 hover:bg-gray-200 active:bg-gray-300 text-gray-700 font-bold select-none cursor-pointer border-l border-gray-200';
            btnInc.innerText = '+';

            container.appendChild(btnDec);
            container.appendChild(input);
            container.appendChild(btnInc);
            wrapper.appendChild(container);

            let isDragging = false;
            let startY = 0;
            let startValue = 0;
            let hasMoved = false;

            const updateVal = (newVal, isManualType = false) => {
                let formatted = newVal;
                if (!isManualType && typeof newVal === 'number') {
                    formatted = parseFloat(newVal.toFixed(4)).toString();
                }
                input.value = formatted;
                onChange(formatted);
            };

            btnDec.addEventListener('click', () => updateVal(parseVal(input.value) - 1));
            btnInc.addEventListener('click', () => updateVal(parseVal(input.value) + 1));
            input.addEventListener('keydown', (e) => {
                if (e.key === 'ArrowUp') { e.preventDefault(); updateVal(parseVal(input.value) + 1); }
                if (e.key === 'ArrowDown') { e.preventDefault(); updateVal(parseVal(input.value) - 1); }
            });

            input.addEventListener('pointerdown', (e) => {
                if (e.button !== 0) return;
                isDragging = true;
                hasMoved = false;
                startY = e.clientY;
                startValue = parseVal(input.value);
                input.setPointerCapture(e.pointerId);
            });

            input.addEventListener('pointermove', (e) => {
                if (!isDragging) return;
                const deltaY = startY - e.clientY; 
                if (Math.abs(deltaY) > 5) {
                    hasMoved = true;
                    const step = Math.sign(deltaY) * Math.floor(Math.abs(deltaY) / 10);
                    updateVal(startValue + step);
                }
            });

            input.addEventListener('pointerup', (e) => {
                isDragging = false;
                input.releasePointerCapture(e.pointerId);
                if (!hasMoved) input.focus(); 
            });

            input.addEventListener('change', () => updateVal(input.value, true));

            return wrapper;
        }

        // --- UI生成処理 ---
        function buildUI() {
            const container = document.getElementById('controlsContainer');
            container.innerHTML = '';

            // 軸設定セクション (項目名と順番を変更)
            const axisSection = document.createElement('div');
            axisSection.innerHTML = '<h3 class="text-sm font-bold text-gray-500 mb-2 border-b">表示範囲 (X/Y比率 1:1)</h3>';
            
            axisSection.appendChild(createUniversalInput({
                id: 'input-xMax', value: config.xMax, label: 'x 最大値',
                onChange: (v) => { config.xMax = parseVal(v); syncScales('x'); updateChart(); }
            }));
            axisSection.appendChild(createUniversalInput({
                id: 'input-xMin', value: config.xMin, label: 'x 最小値',
                onChange: (v) => { config.xMin = parseVal(v); syncScales('x'); updateChart(); }
            }));
            axisSection.appendChild(createUniversalInput({
                id: 'input-yMax', value: config.yMax, label: 'y 最大値',
                onChange: (v) => { config.yMax = parseVal(v); syncScales('y'); updateChart(); }
            }));
            axisSection.appendChild(createUniversalInput({
                id: 'input-yMin', value: config.yMin, label: 'y 最小値',
                onChange: (v) => { config.yMin = parseVal(v); syncScales('y'); updateChart(); }
            }));
            container.appendChild(axisSection);

            // 関数設定セクション (Function -> 関数式 に変更)
            config.funcs.forEach((f, fIdx) => {
                const funcSection = document.createElement('div');
                const funcColorClass = fIdx === 0 ? 'text-blue-600' : 'text-red-600';
                funcSection.innerHTML = `<h3 class="text-sm font-bold ${funcColorClass} mb-2 border-b flex items-center gap-2">
                    <span class="inline-block w-3 h-3 bg-[${f.color}] rounded-sm"></span> 関数式 ${f.id}
                </h3>`;

                const degree = f.coeffs.length - 1;
                funcSection.appendChild(createUniversalInput({
                    value: degree, label: 'n (次数)', color: funcColorClass,
                    onChange: (v) => {
                        let newDeg = Math.max(0, Math.min(10, parseVal(v))); 
                        const newCoeffs = [];
                        for(let i=0; i<=newDeg; i++) {
                            const oldIdx = f.coeffs.length - 1 - (newDeg - i);
                            newCoeffs.push(oldIdx >= 0 ? f.coeffs[oldIdx] : '0');
                        }
                        f.coeffs = newCoeffs;
                        buildUI(); 
                        updateChart();
                    }
                }));

                const coeffsDiv = document.createElement('div');
                coeffsDiv.className = 'pl-2 border-l-2 border-gray-100';
                for (let i = 0; i <= degree; i++) {
                    const power = degree - i;
                    let label = power === 0 ? '定数' : `x<sup class="text-xs">${power > 1 ? power : ''}</sup> の係数`;
                    
                    coeffsDiv.appendChild(createUniversalInput({
                        value: f.coeffs[i], label: label, color: funcColorClass,
                        onChange: (v) => { f.coeffs[i] = v; updateChart(); }
                    }));
                }
                funcSection.appendChild(coeffsDiv);
                container.appendChild(funcSection);
            });
        }

        // --- 1:1アスペクト比の維持 ---
        function syncScales(masterAxis = 'x') {
            const area = chart ? chart.chartArea : null;
            let ratio = area && area.width > 0 ? area.height / area.width : window.innerHeight / window.innerWidth;
            
            if (masterAxis === 'x') {
                const dx = config.xMax - config.xMin;
                const dy = dx * ratio;
                const yCenter = (config.yMax + config.yMin) / 2;
                config.yMin = yCenter - dy / 2;
                config.yMax = yCenter + dy / 2;
            } else {
                const dy = config.yMax - config.yMin;
                const dx = dy / ratio;
                const xCenter = (config.xMax + config.xMin) / 2;
                config.xMin = xCenter - dx / 2;
                config.xMax = xCenter + dx / 2;
            }

            const elYMin = document.getElementById('input-yMin');
            if (elYMin && document.activeElement !== elYMin) elYMin.value = config.yMin.toFixed(2);
            const elYMax = document.getElementById('input-yMax');
            if (elYMax && document.activeElement !== elYMax) elYMax.value = config.yMax.toFixed(2);
            const elXMin = document.getElementById('input-xMin');
            if (elXMin && document.activeElement !== elXMin) elXMin.value = config.xMin.toFixed(2);
            const elXMax = document.getElementById('input-xMax');
            if (elXMax && document.activeElement !== elXMax) elXMax.value = config.xMax.toFixed(2);
        }

        // --- ズームのリセット ---
        function resetZoom() {
            config.xMin = -10;
            config.xMax = 10;
            syncScales('x');
            if (chart) {
                chart.resetZoom('none');
            }
            updateChart();
        }

        // --- XY対応表の更新処理 ---
        function updateTable(baseX) {
            lastHoveredX = baseX;
            const table = document.getElementById('dataTable');
            table.innerHTML = '';
            const trX = document.createElement('tr');
            const trY1 = document.createElement('tr');
            const trY2 = document.createElement('tr');

            trX.innerHTML = '<th class="px-3 py-1 border-b border-r border-gray-300 bg-gray-100 font-bold sticky left-0 z-10">x</th>';
            trY1.innerHTML = '<th class="px-3 py-1 border-b border-r border-gray-300 bg-gray-100 font-bold text-blue-600 sticky left-0 z-10">y₁</th>';
            trY2.innerHTML = '<th class="px-3 py-1 border-r border-gray-300 bg-gray-100 font-bold text-red-600 sticky left-0 z-10">y₂</th>';

            for (let i = -5; i <= 5; i++) {
                const x = Math.round(baseX) + i;
                const y1 = evaluatePoly(config.funcs[0].coeffs, x);
                const y2 = evaluatePoly(config.funcs[1].coeffs, x);

                const tdX = document.createElement('td'); tdX.innerText = x; 
                tdX.className = 'px-3 py-1 border-b border-gray-200 text-center cursor-pointer hover:bg-gray-200 active:bg-gray-300 transition-colors';
                
                const tdY1 = document.createElement('td'); tdY1.innerText = parseFloat(y1.toFixed(3)); 
                tdY1.className = 'px-3 py-1 border-b border-gray-200 text-center cursor-pointer hover:bg-blue-100 active:bg-blue-200 transition-colors text-blue-800';
                
                const tdY2 = document.createElement('td'); tdY2.innerText = parseFloat(y2.toFixed(3)); 
                tdY2.className = 'px-3 py-1 text-center cursor-pointer hover:bg-red-100 active:bg-red-200 transition-colors text-red-800';

                tdX.addEventListener('pointerdown', () => showCrosshair(x, null, '#4b5563'));
                tdY1.addEventListener('pointerdown', () => showCrosshair(x, y1, config.funcs[0].color));
                tdY2.addEventListener('pointerdown', () => showCrosshair(x, y2, config.funcs[1].color));

                trX.appendChild(tdX);
                trY1.appendChild(tdY1);
                trY2.appendChild(tdY2);
            }

            table.appendChild(trX);
            table.appendChild(trY1);
            table.appendChild(trY2);
        }

        function showCrosshair(x, y, color) {
            activeCrosshair = { x, y, color };
            chart.update('none'); 
        }

        // --- Chart.js カスタムプラグイン ---
        const stickyAxesPlugin = {
            id: 'stickyAxes',
            afterDraw(chart) {
                const ctx = chart.ctx;
                const { top, bottom, left, right } = chart.chartArea;
                const x0 = chart.scales.x.getPixelForValue(0);
                const y0 = chart.scales.y.getPixelForValue(0);

                const drawX = Math.max(left, Math.min(right, x0));
                const drawY = Math.max(top, Math.min(bottom, y0));

                ctx.save();
                ctx.lineWidth = 2.5;
                ctx.strokeStyle = 'rgba(0, 0, 0, 0.7)';
                ctx.beginPath();
                ctx.moveTo(left, drawY);
                ctx.lineTo(right, drawY);
                ctx.stroke();
                ctx.beginPath();
                ctx.moveTo(drawX, top);
                ctx.lineTo(drawX, bottom);
                ctx.stroke();
                ctx.restore();
            }
        };

        const crosshairPlugin = {
            id: 'crosshair',
            afterDraw(chart) {
                if (!activeCrosshair) return;
                const ctx = chart.ctx;
                const area = chart.chartArea;
                const pxX = chart.scales.x.getPixelForValue(activeCrosshair.x);

                ctx.save();
                ctx.lineWidth = 1.5;
                ctx.strokeStyle = activeCrosshair.color;
                ctx.setLineDash([6, 4]); 
                ctx.beginPath();

                if (pxX >= area.left && pxX <= area.right) {
                    ctx.moveTo(pxX, area.top);
                    ctx.lineTo(pxX, area.bottom);
                }

                if (activeCrosshair.y !== null) {
                    const pxY = chart.scales.y.getPixelForValue(activeCrosshair.y);
                    if (pxY >= area.top && pxY <= area.bottom) {
                        ctx.moveTo(area.left, pxY);
                        ctx.lineTo(area.right, pxY);
                    }
                    
                    if (pxX >= area.left && pxX <= area.right && pxY >= area.top && pxY <= area.bottom) {
                        ctx.stroke(); 
                        ctx.beginPath();
                        ctx.arc(pxX, pxY, 6, 0, 2 * Math.PI);
                        ctx.fillStyle = activeCrosshair.color;
                        ctx.fill();
                        ctx.strokeStyle = '#fff';
                        ctx.setLineDash([]);
                        ctx.lineWidth = 2;
                    }
                }
                ctx.stroke();
                ctx.restore();
            }
        };

        Chart.register(stickyAxesPlugin, crosshairPlugin);

        // --- グラフ描画・更新処理 ---
        function initChart() {
            const ctx = document.getElementById('myChart').getContext('2d');
            chart = new Chart(ctx, {
                type: 'line',
                data: { datasets: [] },
                options: {
                    responsive: true,
                    maintainAspectRatio: false,
                    animation: false,
                    interaction: { mode: 'index', intersect: false },
                    plugins: {
                        legend: {
                            position: 'top',
                            labels: {
                                usePointStyle: false,
                                boxWidth: 16,
                                boxHeight: 16,
                                font: { size: 14, weight: 'bold', family: 'monospace' },
                                generateLabels: function(chart) {
                                    // デフォルトのラベル生成
                                    const originalLabels = Chart.defaults.plugins.legend.labels.generateLabels(chart);
                                    // 先頭にリセット用の黒い四角「o」を追加
                                    return [
                                        {
                                            text: 'o',
                                            fillStyle: '#000000',
                                            strokeStyle: '#000000',
                                            lineWidth: 1,
                                            hidden: false,
                                            datasetIndex: -1 // リセット判定用
                                        },
                                        ...originalLabels
                                    ];
                                }
                            },
                            onClick: function(e, legendItem, legend) {
                                if (legendItem.datasetIndex === -1) {
                                    // リセットボタンが押された場合
                                    resetZoom();
                                } else {
                                    // 通常の凡例クリック処理（線の表示/非表示）
                                    Chart.defaults.plugins.legend.onClick.call(this, e, legendItem, legend);
                                }
                            }
                        },
                        tooltip: {
                            usePointStyle: true,
                            callbacks: { labelPointStyle: () => { return { pointStyle: 'circle', rotation: 0 }; } }
                        },
                        zoom: {
                            pan: { enabled: true, mode: 'xy' },
                            zoom: {
                                wheel: { enabled: true },
                                pinch: { enabled: true },
                                mode: 'xy',
                                onZoomComplete: syncAfterMove,
                                onPanComplete: syncAfterMove
                            }
                        }
                    },
                    scales: {
                        x: {
                            type: 'linear',
                            min: config.xMin, max: config.xMax,
                            grid: {
                                color: (c) => c.tick.value % 5 === 0 ? '#9ca3af' : '#e5e7eb',
                                lineWidth: (c) => c.tick.value % 5 === 0 ? 1.5 : 1
                            },
                            ticks: {
                                stepSize: 1,
                                callback: (val) => val % 5 === 0 ? val : ''
                            }
                        },
                        y: {
                            type: 'linear',
                            min: config.yMin, max: config.yMax,
                            grid: {
                                color: (c) => c.tick.value % 5 === 0 ? '#9ca3af' : '#e5e7eb',
                                lineWidth: (c) => c.tick.value % 5 === 0 ? 1.5 : 1
                            },
                            ticks: {
                                stepSize: 1,
                                callback: (val) => val % 5 === 0 ? val : ''
                            }
                        }
                    }
                }
            });

            updateChart();
            updateTable(0); 

            document.getElementById('myChart').addEventListener('pointermove', (e) => {
                if(chart.chartArea) {
                    const xVal = chart.scales.x.getValueForPixel(e.x);
                    const nearestX = Math.round(xVal);
                    if (nearestX !== lastHoveredX) updateTable(nearestX);
                }
            });

            document.getElementById('myChart').addEventListener('pointerdown', () => {
                if (activeCrosshair) {
                    activeCrosshair = null;
                    chart.update('none');
                }
            });
        }

        function syncAfterMove({ chart }) {
            config.xMin = chart.scales.x.min;
            config.xMax = chart.scales.x.max;
            syncScales('x');
            updateChart();
        }

        function updateChart() {
            if (!chart) return;

            const steps = 300;
            const xStep = (config.xMax - config.xMin) / steps;
            
            const datasets = config.funcs.map((f, idx) => {
                const data = [];
                for (let i = 0; i <= steps; i++) {
                    let x = config.xMin + i * xStep;
                    data.push({ x: x, y: evaluatePoly(f.coeffs, x) });
                }
                return {
                    label: `y = ${formatPolynomial(f.coeffs)}`,
                    data: data,
                    borderColor: f.color,
                    borderWidth: 2.5,
                    pointRadius: 0,
                    pointHitRadius: 10,
                    tension: 0.1
                };
            });

            chart.data.datasets = datasets;
            chart.options.scales.x.min = config.xMin;
            chart.options.scales.x.max = config.xMax;
            chart.options.scales.y.min = config.yMin;
            chart.options.scales.y.max = config.yMax;
            
            chart.update('none'); 
            updateTable(lastHoveredX); 
        }

        window.addEventListener('resize', () => {
            if(chart) {
                chart.resize();
                syncScales('x');
                updateChart();
            }
        });

        document.getElementById('togglePanelBtn').addEventListener('click', function() {
            const container = document.getElementById('controlsContainer');
            if (container.style.display === 'none') {
                container.style.display = 'flex';
                this.innerText = '_';
            } else {
                container.style.display = 'none';
                this.innerText = '□';
            }
        });

        window.onload = () => {
            syncScales('x');
            buildUI();
            initChart();
        };
    </script>
</body>
</html>
