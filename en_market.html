<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Realistic English Market - 20 Items</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #fdfae6;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #5d4037; margin-bottom: 5px; }
        p { color: #795548; margin-bottom: 20px; }
        
        #market-container {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(140px, 1fr));
            gap: 15px;
            max-width: 1000px;
            width: 100%;
            background-color: #fff;
            padding: 20px;
            border-radius: 25px;
            box-shadow: 0 15px 35px rgba(0,0,0,0.1);
            border: 8px solid #d4a373;
        }

        .item {
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 12px;
            border-radius: 15px;
            cursor: pointer;
            transition: all 0.3s ease;
            background: #ffffff;
            border: 1px solid #eee;
        }

        .item:hover {
            transform: translateY(-5px);
            box-shadow: 0 8px 15px rgba(0,0,0,0.1);
            border-color: #faae2b;
            background-color: #fffdf0;
        }

        .item svg {
            width: 90px;
            height: 90px;
            filter: drop-shadow(2px 3px 4px rgba(0,0,0,0.1));
        }

        .label {
            margin-top: 8px;
            font-size: 15px;
            font-weight: bold;
            color: #333;
            text-align: center;
            line-height: 1.2;
        }

        .translation {
            display: block;
            font-size: 11px;
            color: #888;
            font-weight: normal;
        }

        #word-display {
            margin-top: 25px;
            font-size: 42px;
            font-weight: bold;
            color: #e64a19;
            height: 50px;
            text-shadow: 1px 1px 2px rgba(0,0,0,0.1);
        }
    </style>
</head>
<body>

    <h1>Realistic English Market</h1>
    <p>イラストをタップして、英語を聴いてみよう！ (20種類)</p>

    <div id="market-container">
        <div class="item" onclick="speak('Apple')">
            <svg viewBox="0 0 100 100">
                <radialGradient id="g-apple" cx="35%" cy="35%" r="65%"><stop offset="0%" style="stop-color:#ff7675"/><stop offset="100%" style="stop-color:#d63031"/></radialGradient>
                <path d="M50 32 C35 32 25 40 25 58 C25 80 42 85 50 82 C58 85 75 80 75 58 C75 40 65 32 50 32" fill="url(#g-apple)"/>
                <path d="M50 34 L54 20" stroke="#5d4037" stroke-width="3"/><path d="M54 20 C62 18 70 22 72 26 L60 30 Z" fill="#2ecc71"/>
            </svg>
            <div class="label">Apple<span class="translation">りんご</span></div>
        </div>

        <div class="item" onclick="speak('Banana')">
            <svg viewBox="0 0 100 100">
                <path d="M25 30 Q45 90 85 50 Q55 100 25 30" fill="#feca57"/><path d="M25 30 L20 25" stroke="#5d4037" stroke-width="4"/>
            </svg>
            <div class="label">Banana<span class="translation">バナナ</span></div>
        </div>

        <div class="item" onclick="speak('Orange')">
            <svg viewBox="0 0 100 100">
                <radialGradient id="g-orange" cx="40%" cy="40%" r="60%"><stop offset="0%" style="stop-color:#fab1a0"/><stop offset="100%" style="stop-color:#e67e22"/></radialGradient>
                <circle cx="50" cy="55" r="30" fill="url(#g-orange)"/><circle cx="50" cy="25" r="2" fill="#27ae60"/>
            </svg>
            <div class="label">Orange<span class="translation">オレンジ</span></div>
        </div>

        <div class="item" onclick="speak('Strawberry')">
            <svg viewBox="0 0 100 100">
                <path d="M50 85 C30 80 25 55 30 40 C35 25 65 25 70 40 C75 55 70 80 50 85" fill="#ff4d4d"/>
                <path d="M40 30 Q50 40 60 30 L50 20 Z" fill="#2ecc71"/>
                <circle cx="45" cy="50" r="1.5" fill="#feca57"/><circle cx="55" cy="60" r="1.5" fill="#feca57"/><circle cx="50" cy="70" r="1.5" fill="#feca57"/>
            </svg>
            <div class="label">Strawberry<span class="translation">いちご</span></div>
        </div>

        <div class="item" onclick="speak('Grapes')">
            <svg viewBox="0 0 100 100">
                <circle cx="40" cy="40" r="10" fill="#6c5ce7"/><circle cx="60" cy="40" r="10" fill="#6c5ce7"/><circle cx="50" cy="55" r="10" fill="#6c5ce7"/><circle cx="40" cy="70" r="10" fill="#6c5ce7"/><circle cx="60" cy="70" r="10" fill="#6c5ce7"/><circle cx="50" cy="80" r="10" fill="#6c5ce7"/>
                <path d="M50 30 L50 15" stroke="#5d4037" stroke-width="3"/>
            </svg>
            <div class="label">Grapes<span class="translation">ぶどう</span></div>
        </div>

        <div class="item" onclick="speak('Peach')">
            <svg viewBox="0 0 100 100">
                <radialGradient id="g-peach"><stop offset="0%" style="stop-color:#ff9a9e"/><stop offset="100%" style="stop-color:#fecfef"/></radialGradient>
                <circle cx="50" cy="55" r="30" fill="url(#g-peach)"/><path d="M50 25 Q55 55 50 85" stroke="#ff7675" fill="none"/>
            </svg>
            <div class="label">Peach<span class="translation">もも</span></div>
        </div>

        <div class="item" onclick="speak('Pineapple')">
            <svg viewBox="0 0 100 100">
                <rect x="35" y="40" width="30" height="45" rx="10" fill="#ee5253"/>
                <path d="M40 40 L35 20 M50 40 L50 15 M60 40 L65 20" stroke="#2ecc71" stroke-width="5"/>
            </svg>
            <div class="label">Pineapple<span class="translation">パイナップル</span></div>
        </div>

        <div class="item" onclick="speak('Watermelon')">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="55" r="32" fill="#2ecc71"/>
                <path d="M35 28 Q50 55 65 28 M25 55 Q50 55 75 55" stroke="#27ae60" stroke-width="3" fill="none"/>
            </svg>
            <div class="label">Watermelon<span class="translation">すいか</span></div>
        </div>

        <div class="item" onclick="speak('Melon')">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="55" r="30" fill="#c5e1a5" stroke="#8bc34a" stroke-width="1"/>
                <path d="M30 40 Q50 55 70 40" stroke="white" stroke-width="1" fill="none"/>
            </svg>
            <div class="label">Melon<span class="translation">メロン</span></div>
        </div>

        <div class="item" onclick="speak('Lemon')">
            <svg viewBox="0 0 100 100">
                <ellipse cx="50" cy="55" rx="30" ry="20" fill="#fff176"/>
                <circle cx="20" cy="55" r="3" fill="#fff176"/><circle cx="80" cy="55" r="3" fill="#fff176"/>
            </svg>
            <div class="label">Lemon<span class="translation">レモン</span></div>
        </div>

        <div class="item" onclick="speak('Tomato')">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="55" r="32" fill="#ff5252"/>
                <path d="M40 28 L50 35 L60 28 L50 20 Z" fill="#2ecc71"/>
            </svg>
            <div class="label">Tomato<span class="translation">トマト</span></div>
        </div>

        <div class="item" onclick="speak('Carrot')">
            <svg viewBox="0 0 100 100">
                <path d="M35 25 L50 90 L65 25 Q50 20 35 25" fill="#ff9f43"/>
                <path d="M45 10 Q50 25 55 10" stroke="#1dd1a1" stroke-width="4" fill="none"/>
            </svg>
            <div class="label">Carrot<span class="translation">にんじん</span></div>
        </div>

        <div class="item" onclick="speak('Eggplant')">
            <svg viewBox="0 0 100 100">
                <ellipse cx="50" cy="65" rx="22" ry="30" fill="#2d3436"/>
                <path d="M40 40 Q50 30 60 40 L50 20 Z" fill="#2d3436"/>
            </svg>
            <div class="label">Eggplant<span class="translation">なす</span></div>
        </div>

        <div class="item" onclick="speak('Broccoli')">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="40" r="20" fill="#2ecc71"/><circle cx="35" cy="50" r="15" fill="#2ecc71"/><circle cx="65" cy="50" r="15" fill="#2ecc71"/>
                <rect x="45" y="60" width="10" height="25" fill="#81c784"/>
            </svg>
            <div class="label">Broccoli<span class="translation">ブロッコリー</span></div>
        </div>

        <div class="item" onclick="speak('Corn')">
            <svg viewBox="0 0 100 100">
                <rect x="42" y="30" width="16" height="50" rx="8" fill="#feca57"/>
                <path d="M38 85 Q40 40 45 30 M62 85 Q60 40 55 30" stroke="#2ecc71" stroke-width="5" fill="none"/>
            </svg>
            <div class="label">Corn<span class="translation">とうもろこし</span></div>
        </div>

        <div class="item" onclick="speak('Potato')">
            <svg viewBox="0 0 100 100">
                <ellipse cx="50" cy="55" rx="30" ry="22" fill="#d7ccc8"/>
                <circle cx="40" cy="45" r="1" fill="#8d6e63"/><circle cx="60" cy="60" r="1" fill="#8d6e63"/>
            </svg>
            <div class="label">Potato<span class="translation">じゃがいも</span></div>
        </div>

        <div class="item" onclick="speak('Onion')">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="58" r="28" fill="#fff9c4" stroke="#d4a373" stroke-width="1"/>
                <path d="M50 30 L50 20" stroke="#d4a373" stroke-width="2"/>
            </svg>
            <div class="label">Onion<span class="translation">たまねぎ</span></div>
        </div>

        <div class="item" onclick="speak('Pumpkin')">
            <svg viewBox="0 0 100 100">
                <ellipse cx="50" cy="60" rx="35" ry="25" fill="#f39c12"/>
                <path d="M50 35 L50 25" stroke="#27ae60" stroke-width="5"/>
            </svg>
            <div class="label">Pumpkin<span class="translation">かぼちゃ</span></div>
        </div>

        <div class="item" onclick="speak('Cabbage')">
            <svg viewBox="0 0 100 100">
                <circle cx="50" cy="55" r="30" fill="#aed581"/>
                <path d="M30 40 Q50 20 70 40 M30 70 Q50 90 70 70" stroke="white" stroke-width="2" fill="none"/>
            </svg>
            <div class="label">Cabbage<span class="translation">キャベツ</span></div>
        </div>

        <div class="item" onclick="speak('Mushroom')">
            <svg viewBox="0 0 100 100">
                <path d="M30 50 Q50 10 70 50 Z" fill="#ff7675"/>
                <rect x="45" y="50" width="10" height="20" fill="#f5f5f5"/>
                <circle cx="40" cy="35" r="3" fill="white"/><circle cx="60" cy="35" r="3" fill="white"/>
            </svg>
            <div class="label">Mushroom<span class="translation">きのこ</span></div>
        </div>

    </div>

    <div id="word-display">Tap an item!</div>

    <script>
        function speak(word) {
            document.getElementById('word-display').innerText = word;
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel();
                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US';
                utterance.rate = 0.9;
                window.speechSynthesis.speak(utterance);
            }
        }
    </script>
</body>
</html>
