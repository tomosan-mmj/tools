<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive English Zoo</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #e0f7fa;
            margin: 0;
            padding: 20px;
        }
        h1 { color: #2e7d32; margin-bottom: 10px; }
        p { color: #555; margin-bottom: 20px; }
        
        #canvas-container {
            position: relative;
            background-color: #fff;
            border-radius: 15px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.1);
            overflow: hidden;
            border: 8px solid #8bc34a;
        }

        svg {
            display: block;
            cursor: pointer;
        }

        .animal:hover {
            filter: brightness(1.2);
            transition: 0.2s;
        }

        #word-display {
            margin-top: 20px;
            font-size: 32px;
            font-weight: bold;
            color: #ef6c00;
            height: 40px;
        }
    </style>
</head>
<body>

    <h1>Interactive English Zoo</h1>
    <p>動物をタップして、英語の発音を聴いてみよう！</p>

    <div id="canvas-container">
        <svg width="800" height="500" viewBox="0 0 800 500" xmlns="http://www.w3.org/2000/svg">
            <rect width="800" height="500" fill="#9ccc65" />
            <path d="M0 200 Q 400 250 800 200 L 800 300 Q 400 350 0 300 Z" fill="#d7ccc8" />
            
            <ellipse cx="150" cy="400" rx="100" ry="60" fill="#4fc3f7" />

            <g class="animal" onclick="speak('Lion')">
                <circle cx="650" cy="150" r="40" fill="#ffa726" /> <circle cx="650" cy="150" r="25" fill="#ffcc80" /> <circle cx="640" cy="145" r="3" fill="#000" /> <circle cx="660" cy="145" r="3" fill="#000" />
                <text x="635" y="210" font-size="14" font-weight="bold">Lion</text>
            </g>

            <g class="animal" onclick="speak('Giraffe')">
                <rect x="100" y="50" width="20" height="120" fill="#fdd835" /> <ellipse cx="120" cy="50" rx="25" ry="15" fill="#fdd835" /> <circle cx="125" cy="45" r="2" fill="#000" />
                <rect x="100" y="160" width="50" height="40" rx="10" fill="#fdd835" /> <text x="90" y="220" font-size="14" font-weight="bold">Giraffe</text>
            </g>

            <g class="animal" onclick="speak('Elephant')">
                <rect x="350" y="120" width="100" height="70" rx="20" fill="#90a4ae" /> <circle cx="340" cy="140" r="35" fill="#90a4ae" /> <rect x="290" y="140" width="40" height="15" rx="5" fill="#90a4ae" /> <circle cx="330" cy="130" r="3" fill="#000" />
                <text x="360" y="210" font-size="14" font-weight="bold">Elephant</text>
            </g>

            <g class="animal" onclick="speak('Penguin')">
                <ellipse cx="150" cy="390" rx="15" ry="25" fill="#263238" /> <ellipse cx="150" cy="395" rx="8" ry="15" fill="#fff" /> <circle cx="150" cy="370" r="10" fill="#263238" /> <text x="125" y="445" font-size="14" font-weight="bold">Penguin</text>
            </g>

            <g class="animal" onclick="speak('Monkey')">
                <circle cx="550" cy="350" r="20" fill="#8d6e63" /> <circle cx="550" cy="320" r="15" fill="#8d6e63" /> <circle cx="545" cy="318" r="2" fill="#000" />
                <circle cx="555" cy="318" r="2" fill="#000" />
                <text x="530" y="385" font-size="14" font-weight="bold">Monkey</text>
            </g>

            <g class="animal" onclick="speak('Zebra')">
                <rect x="680" y="350" width="70" height="45" rx="10" fill="#fff" stroke="#000" /> <line x1="690" y1="350" x2="690" y2="395" stroke="#000" stroke-width="3" />
                <line x1="710" y1="350" x2="710" y2="395" stroke="#000" stroke-width="3" />
                <line x1="730" y1="350" x2="730" y2="395" stroke="#000" stroke-width="3" />
                <circle cx="755" cy="340" r="15" fill="#fff" stroke="#000" /> <text x="700" y="415" font-size="14" font-weight="bold">Zebra</text>
            </g>
        </svg>
    </div>

    <div id="word-display">Tap an animal!</div>

    <script>
        function speak(word) {
            // 表示を更新
            document.getElementById('word-display').innerText = word;

            // ブラウザの音声合成を確認
            if ('speechSynthesis' in window) {
                // 前の音声をキャンセル
                window.speechSynthesis.cancel();

                const utterance = new SpeechSynthesisUtterance(word);
                utterance.lang = 'en-US'; // 英語(アメリカ)に設定
                utterance.rate = 0.9;     // 少しゆっくり
                utterance.pitch = 1.0;
                
                window.speechSynthesis.speak(utterance);
            } else {
                alert("申し訳ありません、お使いのブラウザは音声合成に対応していません。");
            }
        }
    </script>
</body>
</html>
