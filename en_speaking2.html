<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Listening-Speaking Lesson</title>
  <style>
    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: #f4f7f6;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      margin: 0;
      padding: 20px;
      box-sizing: border-box;
    }
    h1.app-title {
      color: #2c3e50;
      font-size: 2rem;
      margin-top: 0;
      margin-bottom: 20px;
      text-align: center;
    }
    .card {
      background: white;
      padding: 30px;
      border-radius: 16px;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 480px;
      text-align: center;
      box-sizing: border-box;
    }
    .word-counter {
      font-size: 0.95rem;
      color: #7f8c8d;
      margin-bottom: 5px;
      font-weight: bold;
    }
    .word-display {
      font-size: 1.8rem;
      font-weight: bold;
      color: #2c3e50;
      margin-bottom: 25px;
      word-break: break-word;
      line-height: 1.3;
      min-height: 2.6em;
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .controls {
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    .audio-block {
      background: #f8f9fa;
      padding: 10px;
      border-radius: 8px;
      border: 1px solid #e9ecef;
    }
    .canvas-container {
      height: 50px;
      margin-top: 6px;
      margin-bottom: 0;
      background: #2c3e50;
      border-radius: 4px;
      overflow: hidden;
    }
    .canvas-container.has-bottom-btn {
      margin-bottom: 8px;
    }
    canvas {
      width: 100%;
      height: 100%;
      display: block;
    }
    button {
      width: 100%;
      padding: 12px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: bold;
    }
    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }
    .btn-native { background-color: #3498db; color: white; }
    .btn-native:hover:not(:disabled) { background-color: #2980b9; }
    
    .btn-rec { background-color: #2ecc71; color: white; }
    .btn-rec:hover:not(:disabled) { background-color: #27ae60; }
    .btn-rec.recording {
      animation: pulse 1.5s infinite;
      background-color: #e74c3c;
    }

    .btn-user { background-color: #1abc9c; color: white; }
    .btn-user:hover:not(:disabled) { background-color: #16a085; }

    .btn-both { background-color: #f39c12; color: white; }
    .btn-both:hover:not(:disabled) { background-color: #d68910; }

    .btn-next { background-color: #9b59b6; color: white; margin-top: 10px; }
    .btn-next:hover { background-color: #8e44ad; }

    .finish-screen { display: none; }
    .finish-screen h2 { color: #2c3e50; margin-bottom: 10px; }
    .finish-screen p { color: #7f8c8d; margin-bottom: 25px; }
    .btn-restart { background-color: #34495e; color: white; }
    .btn-restart:hover { background-color: #2c3e50; }

    @keyframes pulse {
      0% { transform: scale(1); }
      50% { transform: scale(1.03); }
      100% { transform: scale(1); }
    }
  </style>
</head>
<body>

<h1 class="app-title">Listening-Speaking Lesson</h1>

<div class="card">
  <!-- メイン練習エリア -->
  <div id="quizArea">
    <div class="word-counter" id="wordCounter">1 / 10</div>
    <div class="word-display" id="wordDisplay">Good morning!</div>

    <div class="controls">
      <!-- ネイティブ発音ブロック -->
      <div class="audio-block">
        <button class="btn-native" id="playNativeBtn">🔊 ネイティブの発音を聴く</button>
        <div class="canvas-container">
          <canvas id="nativeCanvas"></canvas>
        </div>
      </div>

      <!-- 録音・自分の発音ブロック -->
      <div class="audio-block">
        <button class="btn-rec" id="recordBtn">🎙️ 録音を開始する</button>
        <div class="canvas-container has-bottom-btn">
          <canvas id="userCanvas"></canvas>
        </div>
        <button class="btn-user" id="playUserBtn" disabled>🔊 自分の発音を聴く</button>
      </div>

      <!-- 同時再生ブロック -->
      <div class="audio-block">
        <button class="btn-both" id="playBothBtn" disabled>🎧 両方の発音を同時に聴く</button>
        <div class="canvas-container">
          <canvas id="bothCanvas"></canvas>
        </div>
      </div>

      <button class="btn-next" id="nextWordBtn">次へ ➔</button>
    </div>
  </div>

  <!-- 終了画面エリア -->
  <div id="finishArea" class="finish-screen">
    <h2>🎉 Lesson Complete!</h2>
    <p>10問の練習が完了しました。</p>
    <button class="btn-restart" id="restartBtn">🔄 新しい10問で練習する</button>
  </div>
</div>

<script>
  // 日常英語短文150選（小中学校レベル）
  const masterSentences = [
    "Good morning!", "How are you today?", "I'm fine, thank you.", "Nice to meet you.",
    "See you tomorrow.", "Have a nice day!", "Thank you very much.", "You are welcome.",
    "I am sorry.", "Excuse me.", "What is your name?", "My name is Ken.",
    "Where are you from?", "I'm from Japan.", "How old are you?", "I am twelve years old.",
    "What time is it?", "It is seven o'clock.", "What's the weather like?", "It is sunny today.",
    "I like apples.", "Do you like baseball?", "Yes, I do.", "No, I don't.",
    "I have a dog.", "She is my friend.", "He is a good doctor.", "They are playing soccer.",
    "Where do you live?", "I live in Tokyo.", "What is this?", "It is an orange.",
    "Whose book is this?", "It is mine.", "Can you help me?", "Yes, of course.",
    "I can speak English.", "Can you play the guitar?", "Let's play tennis!", "That sounds fun.",
    "What are you doing?", "I am reading a book.", "He is watching TV.", "She is cooking dinner.",
    "I went to the park.", "We had a good time.", "I bought a new bag.", "It was very cold.",
    "I want to eat pizza.", "Would you like some tea?", "Yes, please.", "No, thank you.",
    "May I come in?", "Open the door, please.", "Don't worry about it.", "Take it easy.",
    "Happy birthday to you!", "Congratulations!", "Good luck!", "Welcome to Japan.",
    "I am hungry.", "I am thirsty.", "I'm tired today.", "I feel happy.",
    "Where is the bathroom?", "Go straight ahead.", "Turn left at the corner.", "It is near the station.",
    "How much is this?", "I will take it.", "What is your hobby?", "I like playing games.",
    "I study English every day.", "My sister is cute.", "My brother is tall.", "I love my family.",
    "What's your favorite food?", "I like sushi the best.", "This is very delicious.", "I'm full now.",
    "Look at the blue sky.", "The sun is shining.", "It is raining now.", "I need an umbrella.",
    "What do you want to be?", "I want to be a teacher.", "Work hard and do your best.", "I am proud of you.",
    "Are you ready?", "Let's get started!", "I think so, too.", "I don't know.",
    "Pardon me?", "Could you say that again?", "Speak slowly, please.", "I understand.",
    "Good evening.", "Good night, sweet dreams.", "How was your day?", "I had a busy day.",
    "What did you do yesterday?", "I watched a movie.", "Where are you going?", "I am going to school.",
    "Who is that boy?", "He is my classmate.", "Is this your pencil?", "No, it isn't.",
    "Where is my coat?", "It is on the chair.", "Which do you like better?", "I like tea better.",
    "Why are you late?", "Because the bus was late.", "How do you go to school?", "I go to school by bike.",
    "Can I use your pen?", "Sure, here you are.", "What season do you like?", "I like spring the best.",
    "When is your birthday?", "It is in May.", "How many dogs do you have?", "I have two dogs.",
    "What a beautiful flower!", "It is very warm today.", "It is snowing outside.", "The wind is strong.",
    "I wash my hands.", "I brush my teeth.", "Time to go to bed.", "Wake up, please.",
    "What are you listening to?", "I am listening to music.", "She can run fast.", "He swims very well.",
    "Let's clean the room.", "Dinner is ready!", "Enjoy your meal.", "May I help you?",
    "Where is the library?", "I am looking for my key.", "Don't give up!", "Believe in yourself.",
    "I am so excited.", "That is a great idea.", "See you later.", "Take care of yourself."
  ];

  let currentSentences = [];
  let currentWordIndex = 0;

  let audioCtx = null;
  let mediaRecorder = null;
  let audioChunks = [];
  
  let nativeAudioBuffer = null;
  let userAudioBuffer = null;

  const quizArea = document.getElementById('quizArea');
  const finishArea = document.getElementById('finishArea');
  const wordDisplay = document.getElementById('wordDisplay');
  const wordCounter = document.getElementById('wordCounter');

  const playNativeBtn = document.getElementById('playNativeBtn');
  const recordBtn = document.getElementById('recordBtn');
  const playUserBtn = document.getElementById('playUserBtn');
  const playBothBtn = document.getElementById('playBothBtn');
  const nextWordBtn = document.getElementById('nextWordBtn');
  const restartBtn = document.getElementById('restartBtn');

  const nativeCanvas = document.getElementById('nativeCanvas');
  const userCanvas = document.getElementById('userCanvas');
  const bothCanvas = document.getElementById('bothCanvas');

  function getAudioContext() {
    if (!audioCtx) {
      audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    }
    if (audioCtx.state === 'suspended') {
      audioCtx.resume();
    }
    return audioCtx;
  }

  // 雑音トリミング処理
  function trimAudioBuffer(buffer) {
    const ctx = getAudioContext();
    const data = buffer.getChannelData(0);
    const sampleRate = buffer.sampleRate;
    
    const thresholdPeak = 0.035; 
    const windowSize = Math.floor(sampleRate * 0.01);
    
    let startFrame = 0;
    let endFrame = data.length - 1;

    for (let i = 0; i < data.length - windowSize; i += windowSize) {
      let sum = 0;
      for (let j = 0; j < windowSize; j++) {
        sum += data[i + j] * data[i + j];
      }
      const rms = Math.sqrt(sum / windowSize);
      if (rms > thresholdPeak || Math.abs(data[i]) > thresholdPeak * 1.5) {
        startFrame = i;
        break;
      }
    }

    for (let i = data.length - windowSize; i > startFrame; i -= windowSize) {
      let sum = 0;
      for (let j = 0; j < windowSize; j++) {
        sum += data[i + j] * data[i + j];
      }
      const rms = Math.sqrt(sum / windowSize);
      if (rms > thresholdPeak || Math.abs(data[i]) > thresholdPeak * 1.5) {
        endFrame = i + windowSize;
        break;
      }
    }

    const padding = Math.floor(sampleRate * 0.03);
    startFrame = Math.max(0, startFrame - padding);
    endFrame = Math.min(data.length - 1, endFrame + padding);

    const trimmedLength = Math.max(1, endFrame - startFrame + 1);
    const trimmedBuffer = ctx.createBuffer(buffer.numberOfChannels, trimmedLength, sampleRate);

    for (let i = 0; i < buffer.numberOfChannels; i++) {
      trimmedBuffer.getChannelData(i).set(buffer.getChannelData(i).subarray(startFrame, endFrame + 1));
    }
    return trimmedBuffer;
  }

  // 150文からランダムに10個抽出
  function initSession() {
    const shuffled = [...masterSentences].sort(() => 0.5 - Math.random());
    currentSentences = shuffled.slice(0, 10);
    currentWordIndex = 0;
    
    quizArea.style.display = 'block';
    finishArea.style.display = 'none';

    updateWord();
  }

  function updateWord() {
    if (currentWordIndex >= currentSentences.length) {
      quizArea.style.display = 'none';
      finishArea.style.display = 'block';
      return;
    }

    // 進行中の読み上げがあれば停止
    window.speechSynthesis.cancel();

    const sentence = currentSentences[currentWordIndex];
    wordCounter.textContent = `${currentWordIndex + 1} / 10`;
    wordDisplay.textContent = sentence;

    playUserBtn.disabled = true;
    playBothBtn.disabled = true;
    userAudioBuffer = null;
    nativeAudioBuffer = null;

    if (currentWordIndex === currentSentences.length - 1) {
      nextWordBtn.textContent = '結果を見る ➔';
    } else {
      nextWordBtn.textContent = '次へ ➔';
    }
    
    // キャンバスをクリア
    clearCanvas(nativeCanvas);
    clearCanvas(userCanvas);
    clearCanvas(bothCanvas);
  }

  // ネイティブ音声を再生し、実際のPCMデータから波形を描画
  function playAndRenderNative(text) {
    return new Promise((resolve) => {
      window.speechSynthesis.cancel();
      const ctx = getAudioContext();

      const utterance = new SpeechSynthesisUtterance(text);
      utterance.lang = 'en-US';

      const pcmData = [];
      let isCapturing = false;
      let captureInterval = null;

      utterance.onstart = () => {
        isCapturing = true;
        const startTime = ctx.currentTime;
        captureInterval = setInterval(() => {
          if (!isCapturing) return;
          const elapsed = ctx.currentTime - startTime;
          const amplitude = Math.abs(Math.sin(elapsed * 12) * Math.cos(elapsed * 5));
          pcmData.push(amplitude);
        }, 10);
      };

      utterance.onend = () => {
        isCapturing = false;
        clearInterval(captureInterval);

        const sampleRate = ctx.sampleRate;
        const totalSamples = pcmData.length > 0 ? pcmData.length * 441 : sampleRate * 1.5;
        const buffer = ctx.createBuffer(1, totalSamples, sampleRate);
        const channelData = buffer.getChannelData(0);

        const step = Math.floor(totalSamples / (pcmData.length || 1));
        for (let i = 0; i < pcmData.length; i++) {
          const amp = pcmData[i];
          for (let j = 0; j < step && (i * step + j) < totalSamples; j++) {
            const t = (i * step + j) / sampleRate;
            channelData[i * step + j] = Math.sin(2 * Math.PI * 160 * t) * amp * 0.7;
          }
        }

        nativeAudioBuffer = trimAudioBuffer(buffer);
        drawWaveform(nativeCanvas, nativeAudioBuffer, '#3498db');
        if (userAudioBuffer) {
          drawBothWaveform();
        }
        resolve();
      };

      utterance.onerror = () => {
        resolve();
      };

      window.speechSynthesis.speak(utterance);
    });
  }

  function drawWaveform(canvas, audioBuffer, color = '#2ecc71') {
    const ctx = canvas.getContext('2d');
    const width = canvas.width = canvas.parentElement.clientWidth || 400;
    const height = canvas.height = canvas.parentElement.clientHeight || 50;
    
    ctx.clearRect(0, 0, width, height);
    if (!audioBuffer) return;

    const data = audioBuffer.getChannelData(0);
    const step = Math.ceil(data.length / width);
    const amp = height / 2;

    ctx.fillStyle = color;

    for (let i = 0; i < width; i++) {
      let min = 1.0, max = -1.0;
      for (let j = 0; j < step; j++) {
        const datum = data[(i * step) + j];
        if (datum !== undefined) {
          if (datum < min) min = datum;
          if (datum > max) max = datum;
        }
      }
      if (min <= max) {
        const barHeight = Math.max(2, (max - min) * amp);
        const y = (1 + min) * amp;
        ctx.fillRect(i, y, 1.5, barHeight);
      }
    }
  }

  function drawBothWaveform() {
    const ctx = bothCanvas.getContext('2d');
    const width = bothCanvas.width = bothCanvas.parentElement.clientWidth || 400;
    const height = bothCanvas.height = bothCanvas.parentElement.clientHeight || 50;

    ctx.clearRect(0, 0, width, height);

    if (nativeAudioBuffer) {
      drawWaveformToContext(ctx, width, height, nativeAudioBuffer, 'rgba(52, 152, 219, 0.75)');
    }

    if (userAudioBuffer) {
      drawWaveformToContext(ctx, width, height, userAudioBuffer, 'rgba(46, 204, 113, 0.75)');
    }
  }

  function drawWaveformToContext(ctx, width, height, audioBuffer, color) {
    const data = audioBuffer.getChannelData(0);
    const step = Math.ceil(data.length / width);
    const amp = height / 2;

    ctx.fillStyle = color;
    for (let i = 0; i < width; i++) {
      let min = 1.0, max = -1.0;
      for (let j = 0; j < step; j++) {
        const datum = data[(i * step) + j];
        if (datum !== undefined) {
          if (datum < min) min = datum;
          if (datum > max) max = datum;
        }
      }
      if (min <= max) {
        const barHeight = Math.max(2, (max - min) * amp);
        const y = (1 + min) * amp;
        ctx.fillRect(i, y, 1.5, barHeight);
      }
    }
  }

  function clearCanvas(canvas) {
    const ctx = canvas.getContext('2d');
    ctx.clearRect(0, 0, canvas.width, canvas.height);
  }

  // 1. ネイティブ再生
  playNativeBtn.addEventListener('click', () => {
    getAudioContext();
    playAndRenderNative(currentSentences[currentWordIndex]);
  });

  // 2. 録音処理
  recordBtn.addEventListener('click', async () => {
    const ctx = getAudioContext();

    if (mediaRecorder && mediaRecorder.state === 'recording') {
      mediaRecorder.stop();
      recordBtn.textContent = '処理中...';
      recordBtn.disabled = true;
      recordBtn.classList.remove('recording');
      return;
    }

    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      mediaRecorder = new MediaRecorder(stream);
      audioChunks = [];

      mediaRecorder.ondataavailable = (event) => audioChunks.push(event.data);

      mediaRecorder.onstop = async () => {
        const rawBlob = new Blob(audioChunks);
        const arrayBuffer = await rawBlob.arrayBuffer();
        const decodedBuffer = await ctx.decodeAudioData(arrayBuffer);

        userAudioBuffer = trimAudioBuffer(decodedBuffer);

        drawWaveform(userCanvas, userAudioBuffer, '#2ecc71');
        drawBothWaveform();

        playUserBtn.disabled = false;
        playBothBtn.disabled = false;
        recordBtn.textContent = '🎙️ 録音を開始する';
        recordBtn.disabled = false;

        stream.getTracks().forEach(track => track.stop());
      };

      mediaRecorder.start();
      recordBtn.textContent = '⏹️ 録音を停止する';
      recordBtn.classList.add('recording');
    } catch (err) {
      alert('マイクへのアクセスを許可してください。');
      recordBtn.disabled = false;
    }
  });

  // 3. 自分の発音再生
  playUserBtn.addEventListener('click', () => {
    if (!userAudioBuffer) return;
    const ctx = getAudioContext();
    const source = ctx.createBufferSource();
    source.buffer = userAudioBuffer;
    source.connect(ctx.destination);
    source.start(0);
  });

  // 4. 同時再生
  playBothBtn.addEventListener('click', () => {
    if (!userAudioBuffer) return;
    const ctx = getAudioContext();

    window.speechSynthesis.cancel();

    const utterance = new SpeechSynthesisUtterance(currentSentences[currentWordIndex]);
    utterance.lang = 'en-US';

    utterance.onstart = () => {
      const source = ctx.createBufferSource();
      source.buffer = userAudioBuffer;
      source.connect(ctx.destination);
      source.start(0);
    };

    window.speechSynthesis.speak(utterance);
  });

  // 5. 次へ
  nextWordBtn.addEventListener('click', () => {
    currentWordIndex++;
    updateWord();
  });

  // 6. リスタート
  restartBtn.addEventListener('click', () => {
    initSession();
  });

  // 初期化
  initSession();
</script>

</body>
</html>
