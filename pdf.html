<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDFキーワード・プロパティ集計ツール (ソート対応)</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <style>
        .table-container {
            max-height: 75vh;
            overflow-x: auto;
            overflow-y: auto;
        }
        th {
            position: sticky;
            top: 0;
            z-index: 10;
        }
    </style>
</head>
<body class="bg-gray-50 text-gray-800 font-sans p-4 md:p-8">

    <div class="max-w-[98%] mx-auto">
        <h1 class="text-3xl font-bold mb-6 text-blue-700">PDFキーワード集計ツール (ソート対応)</h1>
        
        <div class="bg-white p-6 rounded-lg shadow-md mb-8 border border-gray-200">
            <h2 class="text-xl font-semibold mb-4">1. PDFファイルを選択</h2>
            <p class="mb-4 text-sm text-gray-600">複数のPDFファイルを選択し、「集計を開始する」を押してください。ブラウザ内で安全に処理されます。</p>
            
            <input type="file" id="fileInput" multiple accept=".pdf" 
                class="block w-full text-sm text-gray-500
                file:mr-4 file:py-2 file:px-4
                file:rounded-md file:border-0
                file:text-sm file:font-semibold
                file:bg-blue-50 file:text-blue-700
                hover:file:bg-blue-100 cursor-pointer border border-gray-300 rounded-md p-2">
                
            <button id="processBtn" class="mt-4 bg-blue-600 hover:bg-blue-700 text-white font-bold py-2 px-6 rounded shadow transition-colors disabled:opacity-50 disabled:cursor-not-allowed">
                集計を開始する
            </button>
            
            <div id="errorMessage" class="mt-2 text-sm font-medium text-red-600 hidden"></div>
            
            <div id="status" class="mt-4 text-sm font-medium text-blue-600 hidden">
                処理中... <span id="progressText">0 / 0</span> ファイル完了
            </div>
        </div>

        <div id="resultContainer" class="bg-white p-6 rounded-lg shadow-md border border-gray-200 hidden">
            <h2 class="text-xl font-semibold mb-4">2. 集計結果 <span class="text-sm font-normal text-gray-500 ml-2">※ 見出しをクリックするとソートできます</span></h2>
            <div class="table-container border border-gray-200 rounded-md shadow-inner">
                <table class="min-w-full divide-y divide-gray-200 text-sm" id="resultTable">
                    <thead class="bg-gray-100" id="tableHeader">
                        <!-- JSで動的にヘッダーを生成 -->
                    </thead>
                    <tbody class="bg-white divide-y divide-gray-200" id="tableBody">
                        <!-- JSで動的に結果行を生成 -->
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

        const keywords = [
            "探究", "言語能力", 
            "情報活用能力", "情報", "表形式", "ICT", 
            "AI", "メディアリテラシー", "プログラミング", "デジタル学習基盤"
        ];

        // テーブルの列定義
        const columns = [
            { key: 'filename', label: 'ファイル名', type: 'string', width: 'min-w-[200px]', align: 'left' },
            { key: 'title', label: 'タイトル', type: 'string', width: 'min-w-[150px]', align: 'left' },
            { key: 'author', label: '作成者', type: 'string', width: 'min-w-[120px]', align: 'left' },
            { key: 'rawDate', label: '更新日時', type: 'date', width: 'min-w-[130px]', align: 'center', displayKey: 'date' },
            { key: 'pages', label: 'ページ数', type: 'number', width: 'min-w-[100px]', align: 'center', extraClass: 'border-r-4' }
        ];

        // キーワード列を追加
        keywords.forEach(kw => {
            columns.push({ key: `kw_${kw}`, label: kw, type: 'number', isKeyword: true, align: 'center' });
        });

        // アプリケーションの状態
        let tableData = [];
        let sortConfig = { key: null, direction: 1 }; // direction: 1 (昇順), -1 (降順)

        // UI要素の取得
        const fileInput = document.getElementById('fileInput');
        const processBtn = document.getElementById('processBtn');
        const statusDiv = document.getElementById('status');
        const progressText = document.getElementById('progressText');
        const resultContainer = document.getElementById('resultContainer');
        const tableHeader = document.getElementById('tableHeader');
        const tableBody = document.getElementById('tableBody');
        const errorMessage = document.getElementById('errorMessage');

        function renderHeaders() {
            tableHeader.innerHTML = '';
            const tr = document.createElement('tr');
            
            columns.forEach(col => {
                const th = document.createElement('th');
                const alignClass = col.align === 'left' ? 'text-left' : 'text-center';
                const baseClasses = `px-3 py-3 font-bold text-gray-700 border-r border-gray-200 whitespace-nowrap cursor-pointer hover:bg-gray-200 select-none ${alignClass} ${col.width || ''} ${col.extraClass || ''}`;
                th.className = baseClasses;
                
                // ソートアイコンの表示
                let icon = '<span class="text-gray-300 ml-1 text-xs">↕</span>'; // デフォルト
                if (sortConfig.key === col.key) {
                    icon = sortConfig.direction === 1 
                        ? '<span class="text-blue-600 ml-1 text-xs">▲</span>' 
                        : '<span class="text-blue-600 ml-1 text-xs">▼</span>';
                }

                th.innerHTML = `${col.label} ${icon}`;
                th.addEventListener('click', () => handleSort(col));
                tr.appendChild(th);
            });
            tableHeader.appendChild(tr);
        }

        function handleSort(column) {
            if (sortConfig.key === column.key) {
                // 同じ列をクリックした場合は順序を反転
                sortConfig.direction *= -1;
            } else {
                // 別の列をクリックした場合は昇順からスタート
                sortConfig.key = column.key;
                sortConfig.direction = 1;
            }

            // データのソート
            tableData.sort((a, b) => {
                // エラー行は常に末尾に置くなどの制御も可能ですが、今回は通常ソート
                let valA, valB;

                if (column.isKeyword) {
                    valA = a.counts ? (a.counts[column.label] || 0) : -1;
                    valB = b.counts ? (b.counts[column.label] || 0) : -1;
                } else {
                    valA = a[column.key];
                    valB = b[column.key];
                }

                if (column.type === 'string') {
                    valA = valA || '';
                    valB = valB || '';
                    return valA.localeCompare(valB, 'ja') * sortConfig.direction;
                } else if (column.type === 'number' || column.type === 'date') {
                    valA = valA || 0;
                    valB = valB || 0;
                    return (valA - valB) * sortConfig.direction;
                }
                return 0;
            });

            renderHeaders();
            renderTableBody();
        }

        function renderTableBody() {
            tableBody.innerHTML = '';
            
            tableData.forEach(row => {
                const tr = document.createElement('tr');
                
                if (row.isError) {
                    tr.className = "bg-red-50";
                    const nameTd = document.createElement('td');
                    nameTd.className = "px-4 py-3 text-red-600 border-r border-gray-200 font-medium truncate max-w-xs";
                    nameTd.textContent = row.filename + " (エラー)";
                    tr.appendChild(nameTd);

                    const errorTd = document.createElement('td');
                    errorTd.className = "px-3 py-3 text-center text-red-500 font-bold";
                    errorTd.colSpan = columns.length - 1;
                    errorTd.textContent = "ファイルの読み込みまたは解析に失敗しました";
                    tr.appendChild(errorTd);
                } else {
                    tr.className = "hover:bg-blue-50 transition-colors";
                    
                    columns.forEach(col => {
                        const td = document.createElement('td');
                        const alignClass = col.align === 'left' ? 'text-left' : 'text-center';
                        td.className = `px-3 py-3 border-r border-gray-200 ${alignClass} ${col.extraClass || ''}`;
                        
                        if (col.isKeyword) {
                            const count = row.counts[col.label] || 0;
                            td.textContent = count;
                            if (count > 0) {
                                td.classList.add("text-blue-700", "font-bold", "bg-blue-50/40");
                            } else {
                                td.classList.add("text-gray-400");
                            }
                        } else {
                            // 基本プロパティ列
                            const displayValue = col.displayKey ? row[col.displayKey] : row[col.key];
                            td.textContent = displayValue;
                            td.title = displayValue; // ホバー時全表示用
                            
                            if (col.key === 'filename') {
                                td.classList.add('font-medium', 'text-gray-900', 'truncate', 'max-w-[200px]');
                            } else if (col.key === 'title' || col.key === 'author') {
                                td.classList.add('text-gray-600', 'text-xs', 'truncate', 'max-w-[150px]');
                            } else if (col.key === 'pages') {
                                td.classList.add('font-semibold', 'text-gray-700');
                            } else {
                                td.classList.add('text-gray-600', 'text-xs');
                            }
                        }
                        tr.appendChild(td);
                    });
                }
                tableBody.appendChild(tr);
            });
        }

        function parsePdfDateInfo(pdfDateStr) {
            if (!pdfDateStr) return { formatted: '', timestamp: 0 };
            const match = pdfDateStr.match(/^D:(\d{4})(\d{2})(\d{2})(\d{2})(\d{2})(\d{2})/);
            if (match) {
                const y = match[1];
                const m = match[2];
                const d = match[3];
                const h = match[4];
                const min = match[5];
                const s = match[6];
                
                // ソート用のタイムスタンプを作成
                const dateObj = new Date(`${y}-${m}-${d}T${h}:${min}:${s}Z`);
                
                return {
                    formatted: `${y}/${m}/${d} ${h}:${min}`,
                    timestamp: dateObj.getTime()
                };
            }
            return { formatted: pdfDateStr, timestamp: 0 };
        }

        processBtn.addEventListener('click', async () => {
            errorMessage.classList.add('hidden');
            const files = fileInput.files;
            
            if (files.length === 0) {
                errorMessage.textContent = "PDFファイルを選択してください。";
                errorMessage.classList.remove('hidden');
                return;
            }

            // 初期化
            processBtn.disabled = true;
            statusDiv.classList.remove('hidden');
            resultContainer.classList.remove('hidden');
            
            // データをリセットして初期表示を構築
            tableData = [];
            sortConfig = { key: null, direction: 1 };
            renderHeaders();
            renderTableBody();
            
            let processedCount = 0;
            progressText.textContent = `0 / ${files.length}`;

            for (let i = 0; i < files.length; i++) {
                const file = files[i];
                try {
                    const result = await processPDF(file);
                    tableData.push(result);
                } catch (error) {
                    console.error(`エラー (${file.name}):`, error);
                    tableData.push({
                        filename: file.name,
                        isError: true,
                        // ソート時にエラー行が下に沈むようにデフォルト値を設定
                        rawDate: 0,
                        pages: -1
                    });
                }
                
                processedCount++;
                progressText.textContent = `${processedCount} / ${files.length}`;
                
                // 1件処理するごとにテーブルを再描画 (現在のソート順を維持)
                if (sortConfig.key) {
                    // ソート設定があれば強制的にソートし直す
                    const currentSortCol = columns.find(c => c.key === sortConfig.key);
                    if (currentSortCol) {
                        // 状態を反転させないために一時的に保存して復元
                        const tempDir = sortConfig.direction;
                        sortConfig.direction = tempDir === 1 ? -1 : 1; // handleSort内で反転するので逆を入れる
                        handleSort(currentSortCol);
                    } else {
                        renderTableBody();
                    }
                } else {
                    renderTableBody();
                }
            }

            // 完了時のUI更新
            statusDiv.classList.add('hidden');
            processBtn.disabled = false;
        });

        async function processPDF(file) {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            
            const meta = await pdf.getMetadata();
            const info = meta.info || {};
            const title = info.Title || '';
            const author = info.Author || '';
            
            const dateStr = info.ModDate || info.CreationDate || '';
            const dateInfo = parsePdfDateInfo(dateStr);
            const numPages = pdf.numPages;

            let fullText = "";
            for (let i = 1; i <= pdf.numPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join("");
                fullText += pageText + " ";
            }
            
            const counts = {};
            keywords.forEach(kw => {
                const regex = new RegExp(kw, 'gi'); // g:全て検索 i:大文字小文字区別しない
                const matches = fullText.match(regex);
                counts[kw] = matches ? matches.length : 0;
            });

            return { 
                filename: file.name, 
                title: title,
                author: author,
                date: dateInfo.formatted,
                rawDate: dateInfo.timestamp, // ソート用の見えないデータ
                pages: numPages,
                counts: counts,
                isError: false
            };
        }

        // 初回読み込み時のヘッダー描画
        renderHeaders();
    </script>
</body>
</html>
