<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">

    <title>English Word Flashcards 400</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            background-color: #e3f2fd;
            margin: 0;
            padding: 20px;
            box-sizing: border-box;
        }

        h1 { color: #1565c0; margin-bottom: 5px; text-align: center; }
        .subtitle { color: #555; margin-bottom: 15px; text-align: center; }

        .category-select {
            margin-bottom: 15px;
            text-align: center;
        }

        .category-select label {
            font-weight: bold;
            color: #1565c0;
            margin-right: 8px;
        }

        .category-select select {
            padding: 8px 12px;
            border-radius: 8px;
            border: 2px solid #42a5f5;
            font-size: 1rem;
            outline: none;
            cursor: pointer;
            background-color: #fff;
        }

        #progress {
            color: #1976d2;
            font-weight: bold;
            font-size: 1.1rem;
            margin-bottom: 15px;
        }

        .card {
            background: #fff;
            border-radius: 20px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.12);
            border: 8px solid #42a5f5;
            width: 100%;
            max-width: 420px;
            padding: 30px 20px 35px;
            text-align: center;
            box-sizing: border-box;
        }

        #word {
            font-size: 44px;
            font-weight: bold;
            color: #0d47a1;
            margin-bottom: 20px;
            word-break: break-word;
        }

        /* 音声再生時に表示 */
        #image {
            font-size: 90px;
            line-height: 1.1;
            height: 110px;
            visibility: hidden;
        }

        #translation {
            font-size: 28px;
            font-weight: bold;
            color: #ef6c00;
            height: 40px;
            margin-top: 10px;
            visibility: hidden;
        }

        .buttons {
            display: flex;
            gap: 15px;
            justify-content: center;
            margin-top: 25px;
            flex-wrap: wrap;
        }

        button {
            font-family: inherit;
            font-size: 1.1rem;
            font-weight: bold;
            border: none;
            border-radius: 12px;
            padding: 14px 26px;
            cursor: pointer;
            color: #fff;
            transition: transform 0.15s, box-shadow 0.15s, opacity 0.15s;
            box-shadow: 0 5px 12px rgba(0,0,0,0.15);
        }
        button:hover:not(:disabled) { transform: translateY(-3px); box-shadow: 0 8px 16px rgba(0,0,0,0.2); }
        button:disabled { opacity: 0.45; cursor: not-allowed; box-shadow: none; }

        #speak-btn { background-color: #43a047; }
        #next-btn  { background-color: #1e88e5; }

        /* 終了画面 */
        #finish { display: none; }
        #finish .emoji { font-size: 80px; }
        #finish h2 { color: #1565c0; font-size: 2rem; margin: 10px 0; }
        #restart-btn { background-color: #8e24aa; margin-top: 15px; }
    </style>
</head>

            <option value="sports">スポーツ・楽器・趣味 (20語)</option>
            <option value="colors">形・色 (15語)</option>
            <option value="verbs">動作・動詞 (50語)</option>
            <option value="adjectives">状態・形容詞 (25語)</option>
            <option value="others">生活・概念・その他 (20語)</option>

    </div>

    <div id="progress"></div>

    <div class="card" id="quiz">

        <div id="image"></div>
        <div id="translation"></div>

        <div class="buttons">

            <button id="next-btn" onclick="nextWord()">次へ ▶</button>
        </div>
    </div>

        let TOTAL = 10;
        let quizWords = [];
        let index = 0;
        let currentAudio = null;

        function pickWords() {
            const selectedCategory = document.getElementById('category-dropdown').value;
            let pool = WORD_POOL;

            if (selectedCategory !== 'all') {
                pool = WORD_POOL.filter(item => item.category === selectedCategory);
            }

            const shuffled = pool.slice();
            for (let i = shuffled.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [shuffled[i], shuffled[j]] = [shuffled[j], shuffled[i]];
            }

            const count = Math.min(TOTAL, shuffled.length);
            return { words: shuffled.slice(0, count), total: count };
        }

        function changeCategory() {
            restart();
        }

        function showWord() {
            const current = quizWords[index];
            document.getElementById('word').innerText = current.word;
            document.getElementById('image').innerText = current.image;
            document.getElementById('translation').innerText = current.ja;

            document.getElementById('image').style.visibility = 'hidden';
            document.getElementById('translation').style.visibility = 'hidden';

            document.getElementById('progress').innerText = (index + 1) + ' / ' + quizWords.length;
        }

        // Chrome等での音声ノイズ解消と読み上げ処理
        function readAloud() {
            const current = quizWords[index];

            document.getElementById('image').style.visibility = 'visible';
            document.getElementById('translation').style.visibility = 'visible';

            // 現在再生中の音声を停止
            if (currentAudio) {
                currentAudio.pause();
                currentAudio.currentTime = 0;
            }

            // Web Speech APIを優先的に利用してChromeでの音声掠れ（圧縮ノイズ）を抑える
            if ('speechSynthesis' in window) {
                window.speechSynthesis.cancel(); // 前の読み上げキャンセルのクリア

                const utterance = new SpeechSynthesisUtterance(current.word);
                utterance.lang = 'en-US';
                utterance.rate = 0.9; // 少しゆっくりハッキリ発音

                // Chromeの英語音声(Google US Englishなど)を優先検索
                const voices = window.speechSynthesis.getVoices();
                const englishVoice = voices.find(v => v.lang.startsWith('en') && v.name.includes('Google'));
                if (englishVoice) {
                    utterance.voice = englishVoice;
                }

                window.speechSynthesis.speak(utterance);
            } else {
                // バックアップ用 MP3 音声再生 (Google Dictionary API の最新URL構造)
                const cleanWord = current.word.toLowerCase().replace(/\s+/g, '_');
                const audioUrl = `https://ssl.gstatic.com/dictionary/static/sounds/20200429/${cleanWord}--_us_1.mp3`;
                
                currentAudio = new Audio(audioUrl);
                currentAudio.play().catch(e => console.log('Audio error:', e));
            }
        }

        function nextWord() {
            if (currentAudio) currentAudio.pause();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            index++;
            if (index >= quizWords.length) {
                finish();
                return;
            }
            showWord();
        }

        function finish() {
            if (currentAudio) currentAudio.pause();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            document.getElementById('quiz').style.display = 'none';
            document.getElementById('progress').style.display = 'none';
            document.getElementById('finish').style.display = 'block';
        }

        function restart() {
            if (currentAudio) currentAudio.pause();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();

            const result = pickWords();
            quizWords = result.words;
            index = 0;
            document.getElementById('finish').style.display = 'none';
            document.getElementById('quiz').style.display = 'block';
            document.getElementById('progress').style.display = 'block';
            showWord();
        }

        // 音声エンジン準備
        if ('speechSynthesis' in window) {
            window.speechSynthesis.onvoiceschanged = () => {
                window.speechSynthesis.getVoices();
            };
        }

        // 初期化
        restart();
